name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Only keep the most recent build per branch: a new push cancels any queued or
# running build so they don't pile up and get stuck "Waiting to be started".
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        env:
          NITRO_PRESET: cloudflare-module
        run: bun run build

      - name: Generate static index.html for Capacitor
        env:
          NITRO_PRESET: cloudflare-module
        run: |
          bun run scripts/prerender-capacitor.mjs
          test -f dist/client/index.html

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Generate app icons and splash from logo
        run: bunx capacitor-assets generate --android

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixOrder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
